<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuuly Archive</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background-color: #fdf8f3;
      background-image: radial-gradient(#e4d8cc 1px, transparent 1px);
      background-size: 22px 22px;
      color: #2a2118;
      min-height: 100vh;
      padding: 0 20px 60px;
    }

    .container { max-width: 960px; margin: 0 auto; }

    header {
      padding: 48px 0 32px;
      border-bottom: 1px solid #edddd0;
      margin-bottom: 32px;
    }
    .header-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #1e140a;
    }
    header p {
      margin-top: 6px;
      font-size: 0.92rem;
      color: #a8957e;
      letter-spacing: 0.04em;
      font-weight: 300;
    }
    .back-link {
      font-size: 0.82rem;
      color: #b09070;
      text-decoration: none;
      border: 1px solid #e0cfc0;
      border-radius: 20px;
      padding: 5px 14px;
      font-family: 'DM Sans', inherit;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .back-link:hover { border-color: #b09070; color: #3d2c1e; background: #fdf5ec; }

    .section { margin-bottom: 36px; }
    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .section-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 500;
      color: #1e140a;
    }
    .section-count { font-size: 0.78rem; color: #c4aa90; }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }

    .card {
      background: #fffcf8;
      border: 1px solid #edddd0;
      border-radius: 14px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 1px 4px rgba(60,30,10,0.05);
    }
    .card:hover { border-color: #c8aa90; transform: translateY(-3px); box-shadow: 0 6px 18px rgba(60,30,10,0.1); }

    .card-swatch {
      flex: 1;
      position: relative;
      min-height: 0;
    }
    .card-swatch-fill {
      position: absolute;
      inset: 0;
      opacity: 0.72;
    }
    .card-extra-dots {
      position: absolute;
      bottom: 7px;
      left: 8px;
      display: flex;
      gap: 4px;
    }
    .card-unarchive {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(255,255,255,0.85);
      border: none;
      color: #b8844a;
      font-size: 0.6rem;
      font-weight: 600;
      font-family: 'DM Sans', inherit;
      letter-spacing: 0.03em;
      cursor: pointer;
      padding: 3px 7px;
      border-radius: 20px;
      line-height: 1.4;
      transition: color 0.15s, background 0.15s;
    }
    .card-unarchive:hover { background: #fff; color: #7a5020; }

    .card-body {
      padding: 8px 10px 9px;
      background: #fffcf8;
      flex-shrink: 0;
    }
    .card-name {
      font-weight: 600;
      font-size: 0.78rem;
      color: #1e140a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }
    .card-meta-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
      flex-wrap: wrap;
    }
    .card-brand { font-size: 0.7rem; color: #b09070; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
    .card-worn { font-size: 0.68rem; color: #c8aa90; white-space: nowrap; }
    .nuuly-badge {
      font-size: 0.62rem;
      font-weight: 600;
      color: #7c3aed;
      background: #f3eeff;
      border: 1px solid #ddd6fe;
      border-radius: 20px;
      padding: 1px 6px;
    }
    .color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.5);
      flex-shrink: 0;
      display: inline-block;
    }

    .empty-archive {
      text-align: center;
      padding: 80px 20px;
      color: #c4aa90;
    }
    .empty-archive p { font-size: 0.92rem; margin-top: 8px; font-weight: 300; }
    .empty-archive .empty-icon { font-size: 2.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-row">
        <div>
          <h1>Nuuly Archive</h1>
          <p>items you've returned or set aside</p>
        </div>
        <a href="/" class="back-link">← My Closet</a>
      </div>
    </header>

    <div id="sections"></div>
  </div>

  <script>
    const COLLECTIONS = ['pants', 'shirts', 'athletic', 'jackets']
    const LABELS = { pants: 'Pants', shirts: 'Shirts', athletic: 'Athletic', jackets: 'Jackets' }

    const COLOR_MAP = {
      black: '#1a1a1a', white: '#f5f5f0', grey: '#9e9e9e', gray: '#9e9e9e',
      'light grey': '#d0d0d0', 'light gray': '#d0d0d0', 'dark grey': '#555', 'dark gray': '#555',
      charcoal: '#444', navy: '#1b2a4a', blue: '#3a72c4', 'light blue': '#7db8e8',
      'dark blue': '#1a3a6e', denim: '#5b7fa6', indigo: '#4b4a8f',
      red: '#d63a3a', crimson: '#c01c2c', burgundy: '#7d1f2e', wine: '#6b1a2a',
      maroon: '#6b2027', pink: '#e87aa0', blush: '#f0c4c4', mauve: '#c4879e',
      coral: '#e8705a', orange: '#e87c30', brown: '#7a5030', tan: '#c4a87a',
      camel: '#c49a5a', khaki: '#bfae7e', beige: '#e8dfc4', cream: '#f5f0e0',
      ivory: '#f7f4ea', 'off-white': '#f0ede4',
      yellow: '#e8c830', gold: '#c8a830', olive: '#6b6b30', green: '#4a7a4a',
      sage: '#8aaa7a', mint: '#8ad4b4', teal: '#3a8a8a', emerald: '#2d7a50',
      forest: '#2a5a3a', purple: '#7c3aed', lavender: '#b09ae0', lilac: '#c4a8d4',
      plum: '#6a2a6a', violet: '#6a3aaa', magenta: '#c03a8a',
      silver: '#b8b8b8', nude: '#d4b49a', leopard: '#c49a30', floral: '#e87aa0',
      multicolor: 'linear-gradient(135deg, #e87c30, #7c3aed, #3a72c4)',
    }

    function colorToCss(name) {
      return COLOR_MAP[name.toLowerCase().trim()] || '#ccc'
    }

    function renderDot(colorName, size = 10) {
      const css = colorToCss(colorName)
      const isGrad = css.startsWith('linear-gradient')
      const style = isGrad ? `background:${css};` : `background-color:${css};`
      return `<span class="color-dot" style="${style};width:${size}px;height:${size}px" title="${colorName}"></span>`
    }

    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }

    function renderCard(item, collection) {
      const colors = Array.isArray(item.color) ? item.color : (item.color ? [item.color] : [])
      const primary = colors[0] || ''
      const primaryCss = primary ? colorToCss(primary) : '#e8e6e1'
      const isGrad = primaryCss.startsWith('linear-gradient')
      const swatchStyle = isGrad ? `background:${primaryCss};` : `background-color:${primaryCss};`
      const extraDots = colors.length > 1
        ? `<div class="card-extra-dots">${colors.map(c => renderDot(c, 9)).join('')}</div>`
        : ''
      const worn = item.timesWorn != null ? `<span class="card-worn">×${item.timesWorn}</span>` : ''
      const brand = item.brand ? `<span class="card-brand">${escHtml(item.brand)}</span>` : ''
      const nuuly = item.nuuly ? `<span class="nuuly-badge">Nuuly</span>` : ''
      return `
        <div class="card">
          <div class="card-swatch">
            <div class="card-swatch-fill" style="${swatchStyle}"></div>
            ${extraDots}
            <button class="card-unarchive" onclick="unarchiveItem('${collection}','${item._id}')" title="Move back to closet">restore</button>
          </div>
          <div class="card-body">
            <div class="card-name">${escHtml(item.name)}</div>
            <div class="card-meta-row">${brand}${worn}${nuuly}</div>
          </div>
        </div>`
    }

    async function unarchiveItem(collection, id) {
      await fetch(`/api/${collection}/${id}/unarchive`, { method: 'PATCH' })
      await loadAll()
    }

    function renderAll(data) {
      const container = document.getElementById('sections')
      let totalArchived = 0
      const html = COLLECTIONS.map(col => {
        const archived = (data[col] || []).filter(i => i.archived)
        totalArchived += archived.length
        if (!archived.length) return ''
        return `
          <div class="section">
            <div class="section-header">
              <h2>${LABELS[col]}</h2>
              <span class="section-count">${archived.length} item${archived.length !== 1 ? 's' : ''}</span>
            </div>
            <div class="cards">${archived.map(i => renderCard(i, col)).join('')}</div>
          </div>`
      }).join('')

      container.innerHTML = totalArchived === 0
        ? `<div class="empty-archive">
            <div class="empty-icon">🗂</div>
            <p>Nothing archived yet.</p>
           </div>`
        : html
    }

    async function loadAll() {
      const results = await Promise.all(
        COLLECTIONS.map(c => fetch(`/api/${c}`).then(r => r.json()))
      )
      const data = {}
      COLLECTIONS.forEach((c, i) => { data[c] = results[i] })
      renderAll(data)
    }

    loadAll()
  </script>
</body>
</html>
