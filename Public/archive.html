<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archive</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background-color: #fdf8f3;
      background-image: radial-gradient(#e4d8cc 1px, transparent 1px);
      background-size: 22px 22px;
      color: #2a2118;
      min-height: 100vh;
      padding: 0 20px 60px;
    }

    .container { max-width: 960px; margin: 0 auto; }

    header {
      padding: 48px 0 32px;
      border-bottom: 1px solid #edddd0;
      margin-bottom: 32px;
    }
    .header-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #1e140a;
    }
    header p {
      margin-top: 6px;
      font-size: 0.92rem;
      color: #a8957e;
      letter-spacing: 0.04em;
      font-weight: 300;
    }
    .back-link {
      font-size: 0.82rem;
      color: #b09070;
      text-decoration: none;
      border: 1px solid #e0cfc0;
      border-radius: 20px;
      padding: 5px 14px;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .back-link:hover { border-color: #b09070; color: #3d2c1e; background: #fdf5ec; }

    /* Search */
    .search-wrap {
      margin-bottom: 28px;
    }
    .search-input {
      width: 100%;
      padding: 11px 16px;
      border: 1px solid #e0cfc0;
      border-radius: 10px;
      font-size: 0.9rem;
      font-family: 'DM Sans', inherit;
      background: #fffcf8;
      color: #2a2118;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-input:focus { border-color: #b09070; box-shadow: 0 0 0 3px rgba(176,144,112,0.1); }
    .search-input::placeholder { color: #c4aa90; }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 24px;
      border-bottom: 1px solid #edddd0;
      padding-bottom: 0;
    }
    .tab {
      padding: 8px 18px 10px;
      font-size: 0.88rem;
      font-weight: 500;
      color: #b09070;
      cursor: pointer;
      border: none;
      background: none;
      font-family: 'DM Sans', inherit;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab:hover { color: #3d2c1e; }
    .tab.active { color: #1e140a; border-bottom-color: #3d2c1e; }
    .tab-count {
      display: inline-block;
      margin-left: 5px;
      font-size: 0.72rem;
      font-weight: 400;
      color: #c4aa90;
    }

    /* Sections */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .section { margin-bottom: 36px; }
    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .section-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 500;
      color: #1e140a;
    }
    .section-count { font-size: 0.78rem; color: #c4aa90; }

    /* Cards */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }

    .card {
      background: #fffcf8;
      border: 1px solid #edddd0;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 1px 4px rgba(60,30,10,0.05);
    }
    .card:hover { border-color: #c8aa90; transform: translateY(-2px); box-shadow: 0 6px 18px rgba(60,30,10,0.1); }

    .card-swatch {
      position: relative;
      height: 90px;
      flex-shrink: 0;
    }
    .card-swatch-fill { position: absolute; inset: 0; opacity: 0.72; }
    .card-extra-dots {
      position: absolute;
      bottom: 7px;
      left: 8px;
      display: flex;
      gap: 4px;
    }
    .card-restore {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(255,255,255,0.85);
      border: none;
      color: #b8844a;
      font-size: 0.6rem;
      font-weight: 600;
      font-family: 'DM Sans', inherit;
      letter-spacing: 0.03em;
      cursor: pointer;
      padding: 3px 7px;
      border-radius: 20px;
      transition: color 0.15s, background 0.15s;
    }
    .card-restore:hover { background: #fff; color: #7a5020; }

    .card-body { padding: 9px 10px 10px; }
    .card-name {
      font-weight: 600;
      font-size: 0.78rem;
      color: #1e140a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }
    .card-meta-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
      flex-wrap: wrap;
    }
    .card-brand { font-size: 0.7rem; color: #b09070; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80%; }
    .card-worn { position: absolute; top: 7px; left: 8px; font-size: 1rem; font-weight: 700; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.35); white-space: nowrap; pointer-events: none; }
    .card-reason {
      margin-top: 5px;
      font-size: 0.68rem;
      color: #a8957e;
      font-style: italic;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .nuuly-badge { font-size: 0.62rem; font-weight: 600; color: #7c3aed; background: #f3eeff; border: 1px solid #ddd6fe; border-radius: 20px; padding: 1px 6px; }
    .nuuly-bought-badge { font-size: 0.62rem; font-weight: 600; color: #5a2aad; background: #ede8ff; border: 1px solid #c8b8f8; border-radius: 20px; padding: 1px 6px; }
    .thrift-badge { font-size: 0.62rem; font-weight: 600; color: #8a5a1a; background: #fef3e2; border: 1px solid #f0d098; border-radius: 20px; padding: 1px 6px; }
    .swap-badge { font-size: 0.62rem; font-weight: 600; color: #2a7a5a; background: #eefaf4; border: 1px solid #b6e8d2; border-radius: 20px; padding: 1px 6px; }
    .color-dot {
      width: 10px; height: 10px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.5);
      flex-shrink: 0; display: inline-block;
    }

    .empty-state {
      padding: 48px 0;
      color: #c4aa90;
      font-size: 0.88rem;
      font-weight: 300;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-row">
        <div>
          <h1>Archive</h1>
          <p>returned rentals &amp; discarded items</p>
        </div>
        <a href="/" class="back-link">← My Closet</a>
      </div>
    </header>

    <div class="search-wrap">
      <input class="search-input" id="search" type="text" placeholder="Search by name, brand, or discard reason…" oninput="renderAll()" />
    </div>

    <div class="tabs">
      <button class="tab active" id="tab-nuuly" onclick="switchTab('nuuly')">
        Nuuly Returns <span class="tab-count" id="count-nuuly"></span>
      </button>
      <button class="tab" id="tab-discard" onclick="switchTab('discard')">
        Discarded <span class="tab-count" id="count-discard"></span>
      </button>
    </div>

    <div class="tab-panel active" id="panel-nuuly">
      <div id="nuuly-sections"></div>
    </div>
    <div class="tab-panel" id="panel-discard">
      <div id="discard-sections"></div>
    </div>
  </div>

  <script>
    const COLLECTIONS = ['pants', 'skirts', 'dresses', 'shirts', 'pullovers', 'sweaters', 'jackets']
    const LABELS = { pants: 'Pants', skirts: 'Skirts', dresses: 'Dresses', shirts: 'Shirts', pullovers: 'Pull Overs', sweaters: 'Sweaters', jackets: 'Jackets' }

    const COLOR_MAP = {
      black: '#1a1a1a', white: '#f5f5f0', grey: '#9e9e9e', gray: '#9e9e9e',
      'light grey': '#d0d0d0', 'light gray': '#d0d0d0', 'dark grey': '#555', 'dark gray': '#555',
      charcoal: '#444', silver: '#b8b8b8', slate: '#708090', ash: '#a0a0a0',
      cream: '#f5f0e0', ivory: '#f7f4ea', 'off-white': '#f0ede4', beige: '#e8dfc4',
      nude: '#d4b49a', taupe: '#b0a090', stone: '#8a8070',
      navy: '#1b2a4a', blue: '#3a72c4', 'light blue': '#7db8e8', 'dark blue': '#1a3a6e',
      denim: '#5b7fa6', indigo: '#4b4a8f', 'sky blue': '#7ab8d8', 'baby blue': '#a8c8e8',
      'royal blue': '#3050c0', cobalt: '#2050a0', periwinkle: '#9090cc',
      cerulean: '#1a9ac0', 'powder blue': '#a0b8d4', 'electric blue': '#0070e0',
      'light wash': '#c5daf0',
      red: '#d63a3a', crimson: '#c01c2c', burgundy: '#7d1f2e', wine: '#6b1a2a',
      maroon: '#6b2027', scarlet: '#c01c18', 'dark red': '#8a1010', garnet: '#7a1030',
      rust: '#b05030', tomato: '#d0503a', cherry: '#8a1030',
      pink: '#e87aa0', blush: '#f0c4c4', mauve: '#c4879e', coral: '#e8705a',
      'hot pink': '#f0609a', rose: '#e05070', 'dusty rose': '#c07880',
      'light pink': '#f0c8d4', bubblegum: '#f0a0b8', fuchsia: '#c0187a',
      orange: '#e87c30', 'burnt orange': '#c85820', peach: '#f0b090',
      yellow: '#e8c830', gold: '#c8a830', mustard: '#c8a030', lemon: '#e8e040',
      brown: '#7a5030', tan: '#c4a87a', camel: '#c49a5a', khaki: '#bfae7e',
      terracotta: '#c0603a', clay: '#b87a5a', brick: '#9a3020', copper: '#b07040',
      green: '#4a7a4a', sage: '#8aaa7a', mint: '#8ad4b4', teal: '#3a8a8a',
      emerald: '#2d7a50', forest: '#2a5a3a', olive: '#6b6b30',
      lime: '#32CD32', 'lime green': '#32CD32', 'bright green': '#2ab830',
      'hunter green': '#2a5030', 'light green': '#90d090', turquoise: '#30c0b0',
      chartreuse: '#a0d020', 'neon green': '#2ae814', 'dark green': '#1a4a1a',
      purple: '#7c3aed', lavender: '#b09ae0', lilac: '#c4a8d4', plum: '#6a2a6a',
      violet: '#6a3aaa', magenta: '#c03a8a', orchid: '#c070b0', grape: '#6a2090',
      mulberry: '#8a2060',
      leopard: '#c49a30', floral: '#e87aa0', striped: '#8888aa', plaid: '#7a6080',
      multicolor: 'linear-gradient(135deg, #e87c30, #7c3aed, #3a72c4)',
    }

    function colorToCss(name) { return COLOR_MAP[name.toLowerCase().trim()] || '#ccc' }

    function renderDot(colorName, size = 10) {
      const css = colorToCss(colorName)
      const isGrad = css.startsWith('linear-gradient')
      const style = isGrad ? `background:${css};` : `background-color:${css};`
      return `<span class="color-dot" style="${style};width:${size}px;height:${size}px" title="${colorName}"></span>`
    }

    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }

    function renderCard(item, collection, showReason) {
      const mainColor = Array.isArray(item.color) ? item.color[0] : (item.color || '')
      const sub = item.subcolor || ''
      const swatchLookup = sub || mainColor
      const swatchCss = colorToCss(swatchLookup) !== '#ccc' ? colorToCss(swatchLookup) : colorToCss(mainColor)
      const isGrad = swatchCss.startsWith('linear-gradient')
      const swatchStyle = isGrad ? `background:${swatchCss};` : `background-color:${swatchCss};`
      const worn = item.timesWorn != null ? `<span class="card-worn">×${item.timesWorn}</span>` : ''
      const brand = item.brand ? `<span class="card-brand">${escHtml(item.brand)}</span>` : ''
      const subcolorLabel = sub ? `<span style="font-size:0.68rem;color:#a8957e">${escHtml(sub)}</span>` : ''
      const nuuly = item.nuuly ? `<span class="nuuly-badge">Nuuly</span>` : ''
      const nuulyBought = item.nuulyBought ? `<span class="nuuly-bought-badge">NB</span>` : ''
      const thrift = item.thrift ? `<span class="thrift-badge">Thrift</span>` : ''
      const swap = item.swap ? `<span class="swap-badge">Swap</span>` : ''
      const reason = showReason && item.discardReason
        ? `<div class="card-reason">${escHtml(item.discardReason)}</div>` : ''
      const badges = [nuuly, nuulyBought, thrift, swap].filter(Boolean).join('')
      return `
        <div class="card">
          <div class="card-swatch">
            <div class="card-swatch-fill" style="${swatchStyle}"></div>
            <button class="card-restore" onclick="unarchiveItem('${collection}','${item._id}')">restore</button>
            ${worn}
            ${badges ? `<div class="card-extra-dots">${badges}</div>` : ''}
          </div>
          <div class="card-body">
            <div class="card-name">${escHtml(item.name)}</div>
            <div class="card-meta-row">${brand}${subcolorLabel}</div>
            ${reason}
          </div>
        </div>`
    }

    async function unarchiveItem(collection, id) {
      await fetch(`/api/${collection}/${id}/unarchive`, { method: 'PATCH' })
      await loadAll()
    }

    let allData = {}

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'))
      document.getElementById(`tab-${tab}`).classList.add('active')
      document.getElementById(`panel-${tab}`).classList.add('active')
    }

    function renderAll() {
      const query = document.getElementById('search').value.toLowerCase().trim()

      const nuulyItems = []
      const discardItems = []

      COLLECTIONS.forEach(col => {
        (allData[col] || []).filter(i => i.archived).forEach(item => {
          const matchesQuery = !query
            || item.name?.toLowerCase().includes(query)
            || item.brand?.toLowerCase().includes(query)
            || item.discardReason?.toLowerCase().includes(query)
          if (!matchesQuery) return
          if (item.archiveType === 'discard') discardItems.push({ item, col })
          else nuulyItems.push({ item, col })
        })
      })

      document.getElementById('count-nuuly').textContent = nuulyItems.length || ''
      document.getElementById('count-discard').textContent = discardItems.length || ''

      document.getElementById('nuuly-sections').innerHTML =
        renderGrouped(nuulyItems, false) ||
        `<div class="empty-state">No Nuuly returns${query ? ' matching your search' : ''} yet.</div>`

      document.getElementById('discard-sections').innerHTML =
        renderGrouped(discardItems, true) ||
        `<div class="empty-state">No discarded items${query ? ' matching your search' : ''} yet.</div>`
    }

    function renderGrouped(entries, showReason) {
      const byCol = {}
      entries.forEach(({ item, col }) => {
        if (!byCol[col]) byCol[col] = []
        byCol[col].push(item)
      })
      return COLLECTIONS
        .filter(col => byCol[col]?.length)
        .map(col => `
          <div class="section">
            <div class="section-header">
              <h2>${LABELS[col]}</h2>
              <span class="section-count">${byCol[col].length} item${byCol[col].length !== 1 ? 's' : ''}</span>
            </div>
            <div class="cards">${byCol[col].map(i => renderCard(i, col, showReason)).join('')}</div>
          </div>`)
        .join('')
    }

    async function loadAll() {
      const results = await Promise.all(
        COLLECTIONS.map(c => fetch(`/api/${c}`).then(r => r.json()))
      )
      COLLECTIONS.forEach((c, i) => { allData[c] = results[i] })
      renderAll()
    }

    loadAll()
  </script>
</body>
</html>
