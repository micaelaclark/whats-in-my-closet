<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Closet</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8f7f5;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 0 20px 60px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Header */
    header {
      padding: 48px 0 32px;
      border-bottom: 1px solid #e8e6e1;
      margin-bottom: 32px;
    }
    header h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #111;
    }
    header p {
      margin-top: 4px;
      font-size: 0.95rem;
      color: #888;
      letter-spacing: 0.01em;
    }

    /* Sections */
    .section {
      margin-bottom: 36px;
    }
    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .section-header h2 {
      font-size: 1.15rem;
      font-weight: 650;
      color: #111;
      letter-spacing: -0.01em;
    }
    .section-count {
      font-size: 0.8rem;
      color: #bbb;
    }

    /* Cards */
    .cards {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card {
      background: #fff;
      border: 1px solid #e8e6e1;
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: border-color 0.15s;
    }
    .card:hover { border-color: #d0cdc8; }
    .card-dots {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }
    .color-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.1);
      flex-shrink: 0;
    }
    .card-info {
      flex: 1;
      min-width: 0;
    }
    .card-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: #111;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 3px;
      flex-wrap: wrap;
    }
    .card-brand {
      font-size: 0.8rem;
      color: #999;
    }
    .card-worn {
      font-size: 0.78rem;
      color: #bbb;
    }
    .nuuly-badge {
      font-size: 0.7rem;
      font-weight: 600;
      color: #7c3aed;
      background: #f3eeff;
      border: 1px solid #ddd6fe;
      border-radius: 20px;
      padding: 2px 8px;
      letter-spacing: 0.02em;
    }
    .card-wear {
      background: none;
      border: 1px solid #e0ddd8;
      color: #aaa;
      font-size: 0.75rem;
      cursor: pointer;
      padding: 3px 9px;
      border-radius: 20px;
      font-family: inherit;
      white-space: nowrap;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      flex-shrink: 0;
    }
    .card-wear:hover { border-color: #4a7a4a; color: #4a7a4a; background: #f0f7f0; }
    .card-edit {
      background: none;
      border: none;
      color: #ccc;
      font-size: 0.9rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      line-height: 1;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
    }
    .card-edit:hover { color: #3a72c4; background: #eef4ff; }
    .card-delete {
      background: none;
      border: none;
      color: #ccc;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      line-height: 1;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
    }
    .card-delete:hover { color: #e05;  background: #fff0f3; }

    /* Edit modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.15);
    }
    .modal-title {
      font-size: 1rem;
      font-weight: 650;
      color: #111;
      margin-bottom: 16px;
    }
    .modal input[type="text"],
    .modal input[type="number"],
    .modal input[type="date"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #e0ddd8;
      border-radius: 7px;
      font-size: 0.88rem;
      font-family: inherit;
      background: #faf9f7;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.15s;
    }
    .modal input[type="text"]:focus,
    .modal input[type="number"]:focus,
    .modal input[type="date"]:focus { border-color: #aaa; background: #fff; }
    .modal input[type="checkbox"] { width: auto; accent-color: #7c3aed; }

    .empty-state {
      padding: 20px 0;
      color: #bbb;
      font-size: 0.88rem;
    }

    /* Add item toggle */
    .add-toggle {
      background: none;
      border: 1px dashed #d0cdc8;
      border-radius: 10px;
      padding: 10px 16px;
      width: 100%;
      text-align: left;
      font-size: 0.85rem;
      color: #aaa;
      cursor: pointer;
      font-family: inherit;
      margin-top: 8px;
      transition: border-color 0.15s, color 0.15s;
    }
    .add-toggle:hover { border-color: #999; color: #555; }

    /* Add item form */
    .add-form {
      display: none;
      background: #fff;
      border: 1px solid #e8e6e1;
      border-radius: 10px;
      padding: 18px 20px;
      margin-top: 8px;
    }
    .add-form.open { display: block; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .form-grid .full { grid-column: 1 / -1; }
    .add-form input[type="text"],
    .add-form input[type="number"],
    .add-form input[type="date"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #e0ddd8;
      border-radius: 7px;
      font-size: 0.88rem;
      font-family: inherit;
      background: #faf9f7;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.15s;
    }
    .add-form input:focus { border-color: #aaa; background: #fff; }
    .add-form label.check-label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.85rem;
      color: #555;
      cursor: pointer;
    }
    .add-form input[type="checkbox"] { width: auto; accent-color: #7c3aed; }
    .form-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .btn-submit {
      padding: 9px 20px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 0.88rem;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-submit:hover { background: #333; }
    .btn-cancel {
      padding: 9px 16px;
      background: none;
      color: #999;
      border: 1px solid #e0ddd8;
      border-radius: 7px;
      font-size: 0.88rem;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-cancel:hover { border-color: #bbb; color: #555; }

    /* Chart */
    .chart-section {
      background: #fff;
      border: 1px solid #e8e6e1;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 36px;
    }
    .chart-section h2 {
      font-size: 1.15rem;
      font-weight: 650;
      color: #111;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }
    .chart-subtitle {
      font-size: 0.8rem;
      color: #bbb;
      margin-bottom: 20px;
    }
    .chart-wrap {
      position: relative;
      height: 480px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>My Closet</h1>
      <p>your wardrobe, tracked</p>
    </header>

    <!-- Chart -->
    <div class="chart-section">
      <h2>Wardrobe at a Glance</h2>
      <p class="chart-subtitle">days owned × times worn — hover for details</p>
      <div class="chart-wrap">
        <canvas id="wardrobe-chart"></canvas>
      </div>
    </div>

    <!-- Sections -->
    <div id="sections"></div>
  </div>

  <!-- Edit modal -->
  <div class="modal-overlay" id="edit-modal" onclick="handleModalClick(event)">
    <div class="modal">
      <div class="modal-title">Edit item</div>
      <div class="form-grid">
        <input type="text" id="edit-name" placeholder="Name (required)" class="full" />
        <input type="text" id="edit-color" placeholder="Colors, comma-separated (required)" />
        <input type="text" id="edit-brand" placeholder="Brand" />
        <input type="number" id="edit-timesWorn" placeholder="Times worn" min="0" />
        <input type="text" id="edit-notes" placeholder="Notes" class="full" />
        <input type="date" id="edit-dateAdded" class="full" />
      </div>
      <label class="check-label" style="margin-top: 8px;">
        <input type="checkbox" id="edit-nuuly" /> Nuuly (rented)
      </label>
      <div class="form-actions">
        <button class="btn-submit" onclick="saveEdit()">Save</button>
        <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const COLLECTIONS = ['pants', 'shirts', 'athletic', 'jackets']
    const LABELS = { pants: 'Pants', shirts: 'Shirts', athletic: 'Athletic', jackets: 'Jackets' }

    // Color name → CSS color mapping
    const COLOR_MAP = {
      black: '#1a1a1a', white: '#f5f5f0', grey: '#9e9e9e', gray: '#9e9e9e',
      'light grey': '#d0d0d0', 'light gray': '#d0d0d0', 'dark grey': '#555', 'dark gray': '#555',
      charcoal: '#444', navy: '#1b2a4a', blue: '#3a72c4', 'light blue': '#7db8e8',
      'dark blue': '#1a3a6e', denim: '#5b7fa6', indigo: '#4b4a8f',
      red: '#d63a3a', crimson: '#c01c2c', burgundy: '#7d1f2e', wine: '#6b1a2a',
      maroon: '#6b2027', pink: '#e87aa0', blush: '#f0c4c4', mauve: '#c4879e',
      coral: '#e8705a', orange: '#e87c30', brown: '#7a5030', tan: '#c4a87a',
      camel: '#c49a5a', khaki: '#bfae7e', beige: '#e8dfc4', cream: '#f5f0e0',
      ivory: '#f7f4ea', off_white: '#f0ede4', 'off-white': '#f0ede4',
      yellow: '#e8c830', gold: '#c8a830', olive: '#6b6b30', green: '#4a7a4a',
      sage: '#8aaa7a', mint: '#8ad4b4', teal: '#3a8a8a', emerald: '#2d7a50',
      forest: '#2a5a3a', purple: '#7c3aed', lavender: '#b09ae0', lilac: '#c4a8d4',
      plum: '#6a2a6a', violet: '#6a3aaa', magenta: '#c03a8a',
      silver: '#b8b8b8', nude: '#d4b49a', leopard: '#c49a30', floral: '#e87aa0',
      multicolor: 'linear-gradient(135deg, #e87c30, #7c3aed, #3a72c4)',
    }

    function colorToCss(name) {
      const key = name.toLowerCase().trim()
      return COLOR_MAP[key] || '#ccc'
    }

    function renderDot(colorName) {
      const css = colorToCss(colorName)
      const isGradient = css.startsWith('linear-gradient')
      const style = isGradient ? `background: ${css};` : `background-color: ${css};`
      return `<span class="color-dot" style="${style}" title="${colorName}"></span>`
    }

    function renderCard(item, collection) {
      const colors = Array.isArray(item.color) ? item.color : (item.color ? [item.color] : [])
      const dots = colors.map(renderDot).join('')
      const worn = item.timesWorn != null ? `<span class="card-worn">Worn ${item.timesWorn}x</span>` : ''
      const brand = item.brand ? `<span class="card-brand">${item.brand}</span>` : ''
      const nuuly = item.nuuly ? `<span class="nuuly-badge">Nuuly</span>` : ''
      return `
        <div class="card">
          <div class="card-dots">${dots || '<span class="color-dot" style="background:#eee"></span>'}</div>
          <div class="card-info">
            <div class="card-name">${escHtml(item.name)}</div>
            <div class="card-meta">${brand}${worn}${nuuly}</div>
          </div>
          <button class="card-wear" onclick="addWear('${collection}', '${item._id}')">+ wear</button>
          <button class="card-edit" onclick="openEditModal('${collection}', '${item._id}')" title="Edit">✎</button>
          <button class="card-delete" onclick="deleteItem('${collection}', '${item._id}')" title="Remove">×</button>
        </div>`
    }

    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }

    function renderSection(collection, items) {
      const label = LABELS[collection]
      const cards = items.length
        ? items.map(i => renderCard(i, collection)).join('')
        : `<div class="empty-state">No items yet.</div>`

      return `
        <div class="section" id="section-${collection}">
          <div class="section-header">
            <h2>${label}</h2>
            <span class="section-count">${items.length} item${items.length !== 1 ? 's' : ''}</span>
          </div>
          <div class="cards">${cards}</div>
          <button class="add-toggle" onclick="toggleAddForm('${collection}')">+ Add item</button>
          <div class="add-form" id="add-form-${collection}">
            <div class="form-grid">
              <input type="text" id="${collection}-name" placeholder="Name (required)" required class="full" />
              <input type="text" id="${collection}-color" placeholder="Colors, comma-separated (required)" required />
              <input type="text" id="${collection}-brand" placeholder="Brand" />
              <input type="number" id="${collection}-timesWorn" placeholder="Times worn" min="0" />
              <input type="text" id="${collection}-notes" placeholder="Notes" class="full" />
              <input type="date" id="${collection}-dateAdded" title="Date acquired" class="full" />
            </div>
            <label class="check-label">
              <input type="checkbox" id="${collection}-nuuly" /> Nuuly (rented)
            </label>
            <div class="form-actions">
              <button class="btn-submit" onclick="addItem('${collection}')">Add</button>
              <button class="btn-cancel" onclick="toggleAddForm('${collection}')">Cancel</button>
            </div>
          </div>
        </div>`
    }

    let allData = { pants: [], shirts: [], athletic: [], jackets: [] }

    function renderAll(data) {
      const container = document.getElementById('sections')
      container.innerHTML = COLLECTIONS.map(c => renderSection(c, data[c] || [])).join('')
    }

    function toggleAddForm(collection) {
      const form = document.getElementById(`add-form-${collection}`)
      form.classList.toggle('open')
    }

    async function addItem(collection) {
      const nameEl = document.getElementById(`${collection}-name`)
      const colorEl = document.getElementById(`${collection}-color`)
      if (!nameEl.value.trim() || !colorEl.value.trim()) {
        nameEl.style.borderColor = nameEl.value.trim() ? '' : '#e05'
        colorEl.style.borderColor = colorEl.value.trim() ? '' : '#e05'
        return
      }
      const body = {
        name: nameEl.value.trim(),
        color: colorEl.value.split(',').map(c => c.trim()).filter(Boolean),
        brand: document.getElementById(`${collection}-brand`).value.trim() || undefined,
        timesWorn: document.getElementById(`${collection}-timesWorn`).value
          ? parseInt(document.getElementById(`${collection}-timesWorn`).value) : 0,
        notes: document.getElementById(`${collection}-notes`).value.trim() || undefined,
        nuuly: document.getElementById(`${collection}-nuuly`).checked || undefined,
        dateAdded: document.getElementById(`${collection}-dateAdded`).value || undefined,
      }
      await fetch(`/api/${collection}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      })
      await loadAll()
      // re-open form is handled by loadAll re-rendering
    }

    async function deleteItem(collection, id) {
      await fetch(`/api/${collection}/${id}`, { method: 'DELETE' })
      await loadAll()
    }

    const COLLECTION_COLORS = {
      pants: '#3a72c4', shirts: '#e87c30', athletic: '#4a7a4a', jackets: '#7c3aed'
    }
    let chartInstance = null

    function renderChart() {
      const today = new Date()
      const datasets = COLLECTIONS.map(col => ({
        label: LABELS[col],
        data: (allData[col] || []).map(item => ({
          x: item.dateAdded ? Math.floor((today - new Date(item.dateAdded)) / 86400000) : 0,
          y: item.timesWorn || 0,
          _name: item.name,
          _brand: item.brand || '',
          _hasDate: !!item.dateAdded,
        })),
        backgroundColor: COLLECTION_COLORS[col],
        pointRadius: 8,
        pointHoverRadius: 12,
      }))

      const ctx = document.getElementById('wardrobe-chart').getContext('2d')
      if (chartInstance) chartInstance.destroy()
      chartInstance = new Chart(ctx, {
        type: 'scatter',
        data: { datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'top', labels: { usePointStyle: true, pointStyle: 'circle', color: '#555', font: { size: 12 } } },
            tooltip: {
              callbacks: {
                label(ctx) {
                  const d = ctx.raw
                  const dateStr = d._hasDate ? `${ctx.parsed.x} days owned` : 'date unknown'
                  const brand = d._brand ? ` · ${d._brand}` : ''
                  return `${d._name}${brand} — worn ${ctx.parsed.y}x (${dateStr})`
                }
              }
            }
          },
          scales: {
            x: { title: { display: true, text: 'Days owned', color: '#999', font: { size: 11 } }, grid: { color: '#f0ede8' }, ticks: { color: '#bbb', precision: 0 }, beginAtZero: true },
            y: { title: { display: true, text: 'Times worn', color: '#999', font: { size: 11 } }, grid: { color: '#f0ede8' }, ticks: { color: '#bbb', precision: 0 }, beginAtZero: true, suggestedMax: 5 }
          }
        }
      })
    }

    let editTarget = { collection: null, id: null }

    function openEditModal(collection, id) {
      const item = (allData[collection] || []).find(i => String(i._id) === String(id))
      if (!item) return
      editTarget = { collection, id }
      const colors = Array.isArray(item.color) ? item.color : (item.color ? [item.color] : [])
      document.getElementById('edit-name').value = item.name || ''
      document.getElementById('edit-color').value = colors.join(', ')
      document.getElementById('edit-brand').value = item.brand || ''
      document.getElementById('edit-timesWorn').value = item.timesWorn != null ? item.timesWorn : ''
      document.getElementById('edit-notes').value = item.notes || ''
      document.getElementById('edit-nuuly').checked = !!item.nuuly
      document.getElementById('edit-dateAdded').value = item.dateAdded ? item.dateAdded.slice(0, 10) : ''
      document.getElementById('edit-modal').classList.add('open')
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.remove('open')
      editTarget = { collection: null, id: null }
    }

    function handleModalClick(e) {
      if (e.target === document.getElementById('edit-modal')) closeEditModal()
    }

    async function addWear(collection, id) {
      await fetch(`/api/${collection}/${id}/wear`, { method: 'PATCH' })
      await loadAll()
    }

    async function saveEdit() {
      const { collection, id } = editTarget
      if (!collection || !id) return
      const nameEl = document.getElementById('edit-name')
      const colorEl = document.getElementById('edit-color')
      if (!nameEl.value.trim() || !colorEl.value.trim()) {
        nameEl.style.borderColor = nameEl.value.trim() ? '' : '#e05'
        colorEl.style.borderColor = colorEl.value.trim() ? '' : '#e05'
        return
      }
      const body = {
        name: nameEl.value.trim(),
        color: colorEl.value.split(',').map(c => c.trim()).filter(Boolean),
        brand: document.getElementById('edit-brand').value.trim() || undefined,
        timesWorn: document.getElementById('edit-timesWorn').value
          ? parseInt(document.getElementById('edit-timesWorn').value) : 0,
        notes: document.getElementById('edit-notes').value.trim() || undefined,
        nuuly: document.getElementById('edit-nuuly').checked || undefined,
        dateAdded: document.getElementById('edit-dateAdded').value || undefined,
      }
      await fetch(`/api/${collection}/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      })
      closeEditModal()
      await loadAll()
    }

    async function loadAll() {
      const results = await Promise.all(
        COLLECTIONS.map(c => fetch(`/api/${c}`).then(r => r.json()))
      )
      COLLECTIONS.forEach((c, i) => { allData[c] = results[i] })
      renderAll(allData)
      renderChart()
    }

    loadAll()
  </script>
</body>
</html>
