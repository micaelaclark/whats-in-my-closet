<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Closet</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8f7f5;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 0 20px 60px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Header */
    header {
      padding: 48px 0 32px;
      border-bottom: 1px solid #e8e6e1;
      margin-bottom: 32px;
    }
    header h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #111;
    }
    header p {
      margin-top: 4px;
      font-size: 0.95rem;
      color: #888;
      letter-spacing: 0.01em;
    }

    /* Wore Today */
    .wore-today {
      background: #fff;
      border: 1px solid #e8e6e1;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 20px;
    }
    .wore-today h2 {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 12px;
    }
    .wore-autocomplete-wrap {
      position: relative;
    }
    .wore-autocomplete-wrap input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #e0ddd8;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      background: #faf9f7;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.15s;
    }
    .wore-autocomplete-wrap input:focus { border-color: #aaa; background: #fff; }
    .wore-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid #e0ddd8;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      z-index: 100;
      max-height: 220px;
      overflow-y: auto;
    }
    .wore-dropdown.open { display: block; }
    .wore-dropdown-item {
      padding: 9px 14px;
      cursor: pointer;
      font-size: 0.92rem;
      color: #1a1a1a;
      display: flex;
      align-items: baseline;
      gap: 8px;
      transition: background 0.1s;
    }
    .wore-dropdown-item:hover,
    .wore-dropdown-item.highlighted { background: #f5f3f0; }
    .wore-dropdown-item-collection {
      font-size: 0.78rem;
      color: #bbb;
    }
    .wore-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
      min-height: 0;
    }
    .wore-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #f0ede8;
      border: 1px solid #e0ddd8;
      border-radius: 20px;
      padding: 4px 10px 4px 12px;
      font-size: 0.85rem;
      color: #333;
      font-family: inherit;
    }
    .wore-tag-remove {
      background: none;
      border: none;
      cursor: pointer;
      color: #aaa;
      font-size: 1rem;
      line-height: 1;
      padding: 0;
      font-family: inherit;
      transition: color 0.15s;
    }
    .wore-tag-remove:hover { color: #e05; }
    .wore-log-btn {
      margin-top: 12px;
      padding: 10px 20px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .wore-log-btn:hover { background: #333; }
    .wore-message {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #5a7a5a;
      min-height: 18px;
    }

    /* Search */
    .search-wrap {
      margin-bottom: 32px;
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      padding: 11px 16px 11px 42px;
      border: 1px solid #e0ddd8;
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      background: #fff;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-wrap input:focus { border-color: #bbb; }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #bbb;
      font-size: 1rem;
      pointer-events: none;
    }

    /* Sections */
    .section {
      margin-bottom: 36px;
    }
    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .section-header h2 {
      font-size: 1.15rem;
      font-weight: 650;
      color: #111;
      letter-spacing: -0.01em;
    }
    .section-count {
      font-size: 0.8rem;
      color: #bbb;
    }

    /* Cards */
    .cards {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card {
      background: #fff;
      border: 1px solid #e8e6e1;
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: border-color 0.15s;
    }
    .card:hover { border-color: #d0cdc8; }
    .card-dots {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }
    .color-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.1);
      flex-shrink: 0;
    }
    .card-info {
      flex: 1;
      min-width: 0;
    }
    .card-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: #111;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 3px;
      flex-wrap: wrap;
    }
    .card-brand {
      font-size: 0.8rem;
      color: #999;
    }
    .card-worn {
      font-size: 0.78rem;
      color: #bbb;
    }
    .nuuly-badge {
      font-size: 0.7rem;
      font-weight: 600;
      color: #7c3aed;
      background: #f3eeff;
      border: 1px solid #ddd6fe;
      border-radius: 20px;
      padding: 2px 8px;
      letter-spacing: 0.02em;
    }
    .card-delete {
      background: none;
      border: none;
      color: #ccc;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      line-height: 1;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
    }
    .card-delete:hover { color: #e05;  background: #fff0f3; }

    .empty-state {
      padding: 20px 0;
      color: #bbb;
      font-size: 0.88rem;
    }

    /* Add item toggle */
    .add-toggle {
      background: none;
      border: 1px dashed #d0cdc8;
      border-radius: 10px;
      padding: 10px 16px;
      width: 100%;
      text-align: left;
      font-size: 0.85rem;
      color: #aaa;
      cursor: pointer;
      font-family: inherit;
      margin-top: 8px;
      transition: border-color 0.15s, color 0.15s;
    }
    .add-toggle:hover { border-color: #999; color: #555; }

    /* Add item form */
    .add-form {
      display: none;
      background: #fff;
      border: 1px solid #e8e6e1;
      border-radius: 10px;
      padding: 18px 20px;
      margin-top: 8px;
    }
    .add-form.open { display: block; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .form-grid .full { grid-column: 1 / -1; }
    .add-form input[type="text"],
    .add-form input[type="number"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #e0ddd8;
      border-radius: 7px;
      font-size: 0.88rem;
      font-family: inherit;
      background: #faf9f7;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.15s;
    }
    .add-form input:focus { border-color: #aaa; background: #fff; }
    .add-form label.check-label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.85rem;
      color: #555;
      cursor: pointer;
    }
    .add-form input[type="checkbox"] { width: auto; accent-color: #7c3aed; }
    .form-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .btn-submit {
      padding: 9px 20px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 0.88rem;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-submit:hover { background: #333; }
    .btn-cancel {
      padding: 9px 16px;
      background: none;
      color: #999;
      border: 1px solid #e0ddd8;
      border-radius: 7px;
      font-size: 0.88rem;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-cancel:hover { border-color: #bbb; color: #555; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>My Closet</h1>
      <p>your wardrobe, tracked</p>
    </header>

    <!-- Wore Today -->
    <div class="wore-today">
      <h2>Wore Today</h2>
      <div class="wore-autocomplete-wrap">
        <input type="text" id="wore-input" placeholder="Search for an item…" autocomplete="off" />
        <div class="wore-dropdown" id="wore-dropdown"></div>
      </div>
      <div class="wore-tags" id="wore-tags"></div>
      <button class="wore-log-btn" onclick="submitWoreToday()">Log Outfit</button>
      <div class="wore-message" id="wore-message"></div>
    </div>

    <!-- Search -->
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" id="search-input" placeholder="Search your closet..." oninput="handleSearch(this.value)" />
    </div>

    <!-- Sections -->
    <div id="sections"></div>
  </div>

  <script>
    const COLLECTIONS = ['pants', 'shirts', 'athletic', 'jackets']
    const LABELS = { pants: 'Pants', shirts: 'Shirts', athletic: 'Athletic', jackets: 'Jackets' }

    // Color name → CSS color mapping
    const COLOR_MAP = {
      black: '#1a1a1a', white: '#f5f5f0', grey: '#9e9e9e', gray: '#9e9e9e',
      'light grey': '#d0d0d0', 'light gray': '#d0d0d0', 'dark grey': '#555', 'dark gray': '#555',
      charcoal: '#444', navy: '#1b2a4a', blue: '#3a72c4', 'light blue': '#7db8e8',
      'dark blue': '#1a3a6e', denim: '#5b7fa6', indigo: '#4b4a8f',
      red: '#d63a3a', crimson: '#c01c2c', burgundy: '#7d1f2e', wine: '#6b1a2a',
      maroon: '#6b2027', pink: '#e87aa0', blush: '#f0c4c4', mauve: '#c4879e',
      coral: '#e8705a', orange: '#e87c30', brown: '#7a5030', tan: '#c4a87a',
      camel: '#c49a5a', khaki: '#bfae7e', beige: '#e8dfc4', cream: '#f5f0e0',
      ivory: '#f7f4ea', off_white: '#f0ede4', 'off-white': '#f0ede4',
      yellow: '#e8c830', gold: '#c8a830', olive: '#6b6b30', green: '#4a7a4a',
      sage: '#8aaa7a', mint: '#8ad4b4', teal: '#3a8a8a', emerald: '#2d7a50',
      forest: '#2a5a3a', purple: '#7c3aed', lavender: '#b09ae0', lilac: '#c4a8d4',
      plum: '#6a2a6a', violet: '#6a3aaa', magenta: '#c03a8a',
      silver: '#b8b8b8', nude: '#d4b49a', leopard: '#c49a30', floral: '#e87aa0',
      multicolor: 'linear-gradient(135deg, #e87c30, #7c3aed, #3a72c4)',
    }

    function colorToCss(name) {
      const key = name.toLowerCase().trim()
      return COLOR_MAP[key] || '#ccc'
    }

    function renderDot(colorName) {
      const css = colorToCss(colorName)
      const isGradient = css.startsWith('linear-gradient')
      const style = isGradient ? `background: ${css};` : `background-color: ${css};`
      return `<span class="color-dot" style="${style}" title="${colorName}"></span>`
    }

    function renderCard(item, collection) {
      const colors = Array.isArray(item.color) ? item.color : (item.color ? [item.color] : [])
      const dots = colors.map(renderDot).join('')
      const worn = item.timesWorn != null ? `<span class="card-worn">Worn ${item.timesWorn}x</span>` : ''
      const brand = item.brand ? `<span class="card-brand">${item.brand}</span>` : ''
      const nuuly = item.nuuly ? `<span class="nuuly-badge">Nuuly</span>` : ''
      return `
        <div class="card">
          <div class="card-dots">${dots || '<span class="color-dot" style="background:#eee"></span>'}</div>
          <div class="card-info">
            <div class="card-name">${escHtml(item.name)}</div>
            <div class="card-meta">${brand}${worn}${nuuly}</div>
          </div>
          <button class="card-delete" onclick="deleteItem('${collection}', '${item._id}')" title="Remove">×</button>
        </div>`
    }

    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }

    function renderSection(collection, items) {
      const label = LABELS[collection]
      const cards = items.length
        ? items.map(i => renderCard(i, collection)).join('')
        : `<div class="empty-state">No items yet.</div>`

      return `
        <div class="section" id="section-${collection}">
          <div class="section-header">
            <h2>${label}</h2>
            <span class="section-count">${items.length} item${items.length !== 1 ? 's' : ''}</span>
          </div>
          <div class="cards">${cards}</div>
          <button class="add-toggle" onclick="toggleAddForm('${collection}')">+ Add item</button>
          <div class="add-form" id="add-form-${collection}">
            <div class="form-grid">
              <input type="text" id="${collection}-name" placeholder="Name (required)" required class="full" />
              <input type="text" id="${collection}-color" placeholder="Colors, comma-separated (required)" required />
              <input type="text" id="${collection}-brand" placeholder="Brand" />
              <input type="number" id="${collection}-timesWorn" placeholder="Times worn" min="0" />
              <input type="text" id="${collection}-notes" placeholder="Notes" class="full" />
            </div>
            <label class="check-label">
              <input type="checkbox" id="${collection}-nuuly" /> Nuuly (rented)
            </label>
            <div class="form-actions">
              <button class="btn-submit" onclick="addItem('${collection}')">Add</button>
              <button class="btn-cancel" onclick="toggleAddForm('${collection}')">Cancel</button>
            </div>
          </div>
        </div>`
    }

    let allData = { pants: [], shirts: [], athletic: [], jackets: [] }

    async function loadAll() {
      const results = await Promise.all(
        COLLECTIONS.map(c => fetch(`/api/${c}`).then(r => r.json()))
      )
      COLLECTIONS.forEach((c, i) => { allData[c] = results[i] })
      renderAll(allData)
    }

    function renderAll(data) {
      const container = document.getElementById('sections')
      container.innerHTML = COLLECTIONS.map(c => renderSection(c, data[c] || [])).join('')
    }

    let searchTimeout = null
    async function handleSearch(q) {
      clearTimeout(searchTimeout)
      if (!q.trim()) {
        renderAll(allData)
        return
      }
      searchTimeout = setTimeout(async () => {
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`)
        const data = await res.json()
        renderAll(data)
      }, 200)
    }

    function toggleAddForm(collection) {
      const form = document.getElementById(`add-form-${collection}`)
      form.classList.toggle('open')
    }

    async function addItem(collection) {
      const nameEl = document.getElementById(`${collection}-name`)
      const colorEl = document.getElementById(`${collection}-color`)
      if (!nameEl.value.trim() || !colorEl.value.trim()) {
        nameEl.style.borderColor = nameEl.value.trim() ? '' : '#e05'
        colorEl.style.borderColor = colorEl.value.trim() ? '' : '#e05'
        return
      }
      const body = {
        name: nameEl.value.trim(),
        color: colorEl.value.split(',').map(c => c.trim()).filter(Boolean),
        brand: document.getElementById(`${collection}-brand`).value.trim() || undefined,
        timesWorn: document.getElementById(`${collection}-timesWorn`).value
          ? parseInt(document.getElementById(`${collection}-timesWorn`).value) : 0,
        notes: document.getElementById(`${collection}-notes`).value.trim() || undefined,
        nuuly: document.getElementById(`${collection}-nuuly`).checked || undefined,
      }
      await fetch(`/api/${collection}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      })
      await loadAll()
      // re-open form is handled by loadAll re-rendering
    }

    async function deleteItem(collection, id) {
      await fetch(`/api/${collection}/${id}`, { method: 'DELETE' })
      await loadAll()
    }

    // ── Wore Today autocomplete ──────────────────────────────────────────────
    const woreSelectedItems = [] // { name, collection }
    let woreDropdownIndex = -1
    let woreSearchTimeout = null

    function renderWoreTags() {
      const container = document.getElementById('wore-tags')
      container.innerHTML = woreSelectedItems.map((item, i) =>
        `<span class="wore-tag">${escHtml(item.name)}<button class="wore-tag-remove" onclick="removeWoreTag(${i})" aria-label="Remove ${escHtml(item.name)}">×</button></span>`
      ).join('')
    }

    function removeWoreTag(index) {
      woreSelectedItems.splice(index, 1)
      renderWoreTags()
    }

    function closeWoreDropdown() {
      const dd = document.getElementById('wore-dropdown')
      dd.classList.remove('open')
      dd.innerHTML = ''
      woreDropdownIndex = -1
    }

    function openWoreDropdown(results) {
      const dd = document.getElementById('wore-dropdown')
      if (!results.length) { closeWoreDropdown(); return }
      dd.innerHTML = results.map((item, i) =>
        `<div class="wore-dropdown-item" data-index="${i}" onmousedown="selectWoreItem(${i})">
          ${escHtml(item.name)}<span class="wore-dropdown-item-collection">${escHtml(item.collection)}</span>
        </div>`
      ).join('')
      dd._results = results
      woreDropdownIndex = -1
      dd.classList.add('open')
    }

    function highlightWoreItem(index) {
      const dd = document.getElementById('wore-dropdown')
      const items = dd.querySelectorAll('.wore-dropdown-item')
      items.forEach((el, i) => el.classList.toggle('highlighted', i === index))
      woreDropdownIndex = index
    }

    function selectWoreItem(index) {
      const dd = document.getElementById('wore-dropdown')
      const results = dd._results || []
      const item = results[index]
      if (!item) return
      // Avoid duplicates
      if (!woreSelectedItems.find(s => s.name === item.name)) {
        woreSelectedItems.push({ name: item.name, collection: item.collection })
        renderWoreTags()
      }
      document.getElementById('wore-input').value = ''
      closeWoreDropdown()
    }

    document.getElementById('wore-input').addEventListener('input', function () {
      clearTimeout(woreSearchTimeout)
      const q = this.value.trim()
      if (q.length < 1) { closeWoreDropdown(); return }
      woreSearchTimeout = setTimeout(async () => {
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`)
        const data = await res.json()
        // Flatten collection results into a flat list with collection label
        const flat = []
        for (const col of COLLECTIONS) {
          const items = data[col] || []
          for (const item of items) {
            flat.push({ name: item.name, collection: LABELS[col] || col })
          }
        }
        openWoreDropdown(flat)
      }, 150)
    })

    document.getElementById('wore-input').addEventListener('keydown', function (e) {
      const dd = document.getElementById('wore-dropdown')
      const items = dd.querySelectorAll('.wore-dropdown-item')
      const results = dd._results || []
      if (dd.classList.contains('open')) {
        if (e.key === 'ArrowDown') {
          e.preventDefault()
          highlightWoreItem(Math.min(woreDropdownIndex + 1, items.length - 1))
        } else if (e.key === 'ArrowUp') {
          e.preventDefault()
          highlightWoreItem(Math.max(woreDropdownIndex - 1, 0))
        } else if (e.key === 'Enter') {
          e.preventDefault()
          if (woreDropdownIndex >= 0 && results[woreDropdownIndex]) {
            selectWoreItem(woreDropdownIndex)
          }
        } else if (e.key === 'Escape') {
          closeWoreDropdown()
        }
      }
    })

    // Close dropdown when clicking outside
    document.addEventListener('mousedown', function (e) {
      const wrap = document.querySelector('.wore-autocomplete-wrap')
      if (wrap && !wrap.contains(e.target)) closeWoreDropdown()
    })

    async function submitWoreToday() {
      const msg = document.getElementById('wore-message')
      if (woreSelectedItems.length === 0) {
        msg.textContent = 'Select at least one item.'
        msg.style.color = '#c05a3a'
        return
      }

      const names = woreSelectedItems.map(i => i.name)
      msg.textContent = 'Updating…'
      msg.style.color = '#888'

      const res = await fetch('/api/wore-today', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ names }),
      })
      const data = await res.json()

      if (data.updated && data.updated.length > 0) {
        const updatedNames = data.updated.map(u => u.name).join(', ')
        msg.textContent = `Updated: ${updatedNames}`
        msg.style.color = '#5a7a5a'
        woreSelectedItems.length = 0
        renderWoreTags()
        document.getElementById('wore-input').value = ''
        await loadAll()
      } else {
        msg.textContent = 'No matching items found.'
        msg.style.color = '#c05a3a'
      }
    }

    loadAll()
  </script>
</body>
</html>
