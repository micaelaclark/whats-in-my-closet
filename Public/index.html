<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Closet</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background-color: #fdf8f3;
      background-image: radial-gradient(#e4d8cc 1px, transparent 1px);
      background-size: 22px 22px;
      color: #2a2118;
      min-height: 100vh;
      padding: 0 20px 60px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    .header-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .archive-nav-link {
      font-size: 0.82rem;
      color: #b09070;
      text-decoration: none;
      border: 1px solid #e0cfc0;
      border-radius: 20px;
      padding: 5px 14px;
      font-family: 'DM Sans', inherit;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .archive-nav-link:hover { border-color: #b09070; color: #3d2c1e; background: #fdf5ec; }

    header {
      padding: 48px 0 32px;
      border-bottom: 1px solid #edddd0;
      margin-bottom: 32px;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #1e140a;
    }
    header p {
      margin-top: 6px;
      font-size: 0.92rem;
      color: #a8957e;
      letter-spacing: 0.04em;
      font-weight: 300;
    }

    .section {
      margin-bottom: 36px;
    }
    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .section-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 500;
      color: #1e140a;
      letter-spacing: 0;
    }
    .section-count {
      font-size: 0.78rem;
      color: #c4aa90;
    }

    /* Square card grid */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }

    .card {
      background: #fffcf8;
      border: 1px solid #edddd0;
      border-radius: 14px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 1px 4px rgba(60,30,10,0.05);
    }
    .card:hover { border-color: #c8aa90; transform: translateY(-3px); box-shadow: 0 6px 18px rgba(60,30,10,0.1); }

    .card-swatch {
      flex: 1;
      position: relative;
      min-height: 0;
    }
    .card-swatch-fill {
      position: absolute;
      inset: 0;
      opacity: 0.72;
    }
    .card-extra-dots {
      position: absolute;
      bottom: 7px;
      left: 8px;
      display: flex;
      gap: 4px;
    }
    .card-delete {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(255,255,255,0.75);
      border: none;
      color: #999;
      font-size: 1rem;
      cursor: pointer;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
      padding: 0;
    }
    .card-delete:hover { color: #e05; background: #fff; }

    .card-body {
      padding: 8px 10px 9px;
      background: #fffcf8;
      flex-shrink: 0;
    }
    .card-name {
      font-weight: 600;
      font-size: 0.78rem;
      color: #1e140a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }
    .card-meta-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
      flex-wrap: wrap;
    }
    .card-brand {
      font-size: 0.7rem;
      color: #b09070;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 70%;
    }
    .card-worn {
      font-size: 0.68rem;
      color: #c8aa90;
      white-space: nowrap;
    }
    .nuuly-badge {
      font-size: 0.62rem;
      font-weight: 600;
      color: #7c3aed;
      background: #f3eeff;
      border: 1px solid #ddd6fe;
      border-radius: 20px;
      padding: 1px 6px;
    }

    .color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.5);
      flex-shrink: 0;
      display: inline-block;
    }

    /* Add card (lives inside grid) */
    .card-add {
      border: 1.5px dashed #d8c8b8;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      gap: 5px;
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      transition: border-color 0.15s, background 0.15s;
    }
    .card-add:hover { border-color: #b09070; background: #fdf5ec; }
    .card-add-icon { font-size: 1.6rem; color: #d8c0aa; line-height: 1; }
    .card-add-label { font-size: 0.7rem; color: #c8a888; }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 5px;
    }
    .card-action-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.65rem;
      color: #bbb;
      padding: 0;
      font-family: inherit;
      transition: color 0.12s;
    }
    .card-action-btn--wear:hover { color: #4a7a4a; }
    .card-action-btn--edit:hover { color: #3a72c4; }

    /* Edit modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.15);
    }
    .modal-title {
      font-size: 1rem;
      font-weight: 650;
      color: #111;
      margin-bottom: 16px;
    }
    .modal input[type="text"],
    .modal input[type="number"],
    .modal input[type="date"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #e0ddd8;
      border-radius: 7px;
      font-size: 0.88rem;
      font-family: inherit;
      background: #faf9f7;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.15s;
    }
    .modal input[type="text"]:focus,
    .modal input[type="number"]:focus,
    .modal input[type="date"]:focus { border-color: #aaa; background: #fff; }
    .modal input[type="checkbox"] { width: auto; accent-color: #7c3aed; }

    .empty-state {
      padding: 20px 0;
      color: #bbb;
      font-size: 0.88rem;
    }

    /* Add form */
    .add-form {
      display: none;
      background: #fffcf8;
      border: 1px solid #edddd0;
      border-radius: 14px;
      padding: 18px 20px;
      margin-top: 10px;
    }
    .add-form.open { display: block; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .form-grid .full { grid-column: 1 / -1; }
    .add-form input[type="text"],
    .add-form input[type="number"],
    .add-form input[type="date"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #e0cfc0;
      border-radius: 8px;
      font-size: 0.88rem;
      font-family: 'DM Sans', inherit;
      background: #fdf8f3;
      color: #2a2118;
      outline: none;
      transition: border-color 0.15s;
    }
    .add-form input:focus { border-color: #b09070; background: #fff; }
    .add-form label.check-label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.85rem;
      color: #555;
      cursor: pointer;
    }
    .add-form input[type="checkbox"] { width: auto; accent-color: #7c3aed; }
    .form-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .btn-submit {
      padding: 9px 20px;
      background: #3d2c1e;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.88rem;
      font-family: 'DM Sans', inherit;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-submit:hover { background: #5a3f2a; }
    .btn-cancel {
      padding: 9px 16px;
      background: none;
      color: #b09070;
      border: 1px solid #e0cfc0;
      border-radius: 8px;
      font-size: 0.88rem;
      font-family: 'DM Sans', inherit;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-cancel:hover { border-color: #b09070; color: #3d2c1e; }
    .btn-archive {
      margin-left: auto;
      padding: 9px 16px;
      background: none;
      color: #b8844a;
      border: 1px solid #e8c99a;
      border-radius: 8px;
      font-size: 0.88rem;
      font-family: 'DM Sans', inherit;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .btn-archive:hover { background: #fdf5ec; border-color: #b8844a; }

    /* Charts */
    .charts-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 36px;
    }
    @media (max-width: 620px) { .charts-row { grid-template-columns: 1fr; } }

    .chart-section {
      background: #fffcf8;
      border: 1px solid #edddd0;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 36px;
      box-shadow: 0 1px 4px rgba(60,30,10,0.04);
    }
    .chart-section h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-weight: 500;
      color: #1e140a;
      letter-spacing: 0;
      margin-bottom: 4px;
    }
    .chart-subtitle {
      font-size: 0.78rem;
      color: #c4aa90;
      margin-bottom: 20px;
      font-weight: 300;
    }
    .chart-wrap {
      position: relative;
      height: 320px;
    }
    .chart-wrap--scatter { height: 420px; }
    .chart-wrap--brand { height: 260px; }
    .chart-wrap--color { height: 260px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-row">
        <div>
          <h1>My Closet</h1>
          <p>your wardrobe, tracked</p>
        </div>
        <a href="/archive.html" class="archive-nav-link">Nuuly Archive</a>
      </div>
    </header>

    <!-- Scatter chart -->
    <div class="chart-section">
      <h2>Wardrobe at a Glance</h2>
      <p class="chart-subtitle">days owned × times worn — hover for details</p>
      <div class="chart-wrap chart-wrap--scatter">
        <canvas id="wardrobe-chart"></canvas>
      </div>
    </div>

    <!-- Brand + Color charts side by side -->
    <div class="charts-row">
      <div class="chart-section" style="margin-bottom:0">
        <h2>Brand Insights</h2>
        <p class="chart-subtitle">items owned &amp; times worn by brand</p>
        <div class="chart-wrap chart-wrap--brand" id="brand-chart-wrap">
          <canvas id="brand-chart"></canvas>
        </div>
      </div>
      <div class="chart-section" style="margin-bottom:0">
        <h2>Color Palette</h2>
        <p class="chart-subtitle">color distribution across your wardrobe</p>
        <div class="chart-wrap chart-wrap--color">
          <canvas id="color-chart"></canvas>
        </div>
      </div>
    </div>

    <!-- Clothing sections -->
    <div id="sections"></div>
  </div>

  <!-- Edit modal -->
  <div class="modal-overlay" id="edit-modal" onclick="handleModalClick(event)">
    <div class="modal">
      <div class="modal-title">Edit item</div>
      <div class="form-grid">
        <input type="text" id="edit-name" placeholder="Name (required)" class="full" />
        <input type="text" id="edit-color" placeholder="Colors, comma-separated (required)" />
        <input type="text" id="edit-brand" placeholder="Brand" />
        <input type="number" id="edit-timesWorn" placeholder="Times worn" min="0" />
        <input type="text" id="edit-notes" placeholder="Notes" class="full" />
        <input type="date" id="edit-dateAdded" class="full" />
      </div>
      <label class="check-label" style="margin-top: 8px;">
        <input type="checkbox" id="edit-nuuly" /> Nuuly (rented)
      </label>
      <div class="form-actions">
        <button class="btn-submit" onclick="saveEdit()">Save</button>
        <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
        <button class="btn-archive" onclick="archiveItem()">Archive</button>
      </div>
    </div>
  </div>

  <script>
    const COLLECTIONS = ['pants', 'shirts', 'pullovers', 'athletic', 'jackets']
    const LABELS = { pants: 'Pants', shirts: 'Shirts', pullovers: 'Pull Overs', athletic: 'Athletic', jackets: 'Jackets' }

    const COLOR_MAP = {
      black: '#1a1a1a', white: '#f5f5f0', grey: '#9e9e9e', gray: '#9e9e9e',
      'light grey': '#d0d0d0', 'light gray': '#d0d0d0', 'dark grey': '#555', 'dark gray': '#555',
      charcoal: '#444', navy: '#1b2a4a', blue: '#3a72c4', 'light blue': '#7db8e8',
      'dark blue': '#1a3a6e', denim: '#5b7fa6', indigo: '#4b4a8f',
      red: '#d63a3a', crimson: '#c01c2c', burgundy: '#7d1f2e', wine: '#6b1a2a',
      maroon: '#6b2027', pink: '#e87aa0', blush: '#f0c4c4', mauve: '#c4879e',
      coral: '#e8705a', orange: '#e87c30', brown: '#7a5030', tan: '#c4a87a',
      camel: '#c49a5a', khaki: '#bfae7e', beige: '#e8dfc4', cream: '#f5f0e0',
      ivory: '#f7f4ea', 'off-white': '#f0ede4',
      yellow: '#e8c830', gold: '#c8a830', olive: '#6b6b30', green: '#4a7a4a',
      sage: '#8aaa7a', mint: '#8ad4b4', teal: '#3a8a8a', emerald: '#2d7a50',
      forest: '#2a5a3a', purple: '#7c3aed', lavender: '#b09ae0', lilac: '#c4a8d4',
      plum: '#6a2a6a', violet: '#6a3aaa', magenta: '#c03a8a',
      silver: '#b8b8b8', nude: '#d4b49a', leopard: '#c49a30', floral: '#e87aa0',
      multicolor: 'linear-gradient(135deg, #e87c30, #7c3aed, #3a72c4)',
    }

    function colorToCss(name) {
      return COLOR_MAP[name.toLowerCase().trim()] || '#ccc'
    }

    function renderDot(colorName, size = 10) {
      const css = colorToCss(colorName)
      const isGrad = css.startsWith('linear-gradient')
      const style = isGrad ? `background:${css};` : `background-color:${css};`
      return `<span class="color-dot" style="${style};width:${size}px;height:${size}px" title="${colorName}"></span>`
    }

    function renderCard(item, collection) {
      const colors = Array.isArray(item.color) ? item.color : (item.color ? [item.color] : [])
      const primary = colors[0] || ''
      const primaryCss = primary ? colorToCss(primary) : '#e8e6e1'
      const isGrad = primaryCss.startsWith('linear-gradient')
      const swatchStyle = isGrad ? `background:${primaryCss};` : `background-color:${primaryCss};`
      const extraDots = colors.length > 1
        ? `<div class="card-extra-dots">${colors.map(c => renderDot(c, 9)).join('')}</div>`
        : ''
      const worn = item.timesWorn != null ? `<span class="card-worn">×${item.timesWorn}</span>` : ''
      const brand = item.brand ? `<span class="card-brand">${escHtml(item.brand)}</span>` : ''
      const nuuly = item.nuuly ? `<span class="nuuly-badge">Nuuly</span>` : ''
      return `
        <div class="card">
          <div class="card-swatch">
            <div class="card-swatch-fill" style="${swatchStyle}"></div>
            ${extraDots}
            <button class="card-delete" onclick="deleteItem('${collection}','${item._id}')" title="Remove">×</button>
          </div>
          <div class="card-body">
            <div class="card-name">${escHtml(item.name)}</div>
            <div class="card-meta-row">${brand}${worn}${nuuly}</div>
            <div class="card-actions">
              <button class="card-action-btn card-action-btn--wear" onclick="addWear('${collection}','${item._id}')">+ wear</button>
              <button class="card-action-btn card-action-btn--edit" onclick="openEditModal('${collection}','${item._id}')">edit</button>
            </div>
          </div>
        </div>`
    }

    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }

    function renderSection(collection, items) {
      const label = LABELS[collection]
      const active = items.filter(i => !i.archived)
      const cards = active.length
        ? active.map(i => renderCard(i, collection)).join('')
        : `<div class="empty-state">No items yet.</div>`
      const addCard = `
        <div class="card-add" onclick="toggleAddForm('${collection}')">
          <span class="card-add-icon">+</span>
          <span class="card-add-label">Add item</span>
        </div>`
      return `
        <div class="section" id="section-${collection}">
          <div class="section-header">
            <h2>${label}</h2>
            <span class="section-count">${active.length} item${active.length !== 1 ? 's' : ''}</span>
          </div>
          <div class="cards">${cards}${addCard}</div>
          <div class="add-form" id="add-form-${collection}">
            <div class="form-grid">
              <input type="text" id="${collection}-name" placeholder="Name (required)" required class="full" />
              <input type="text" id="${collection}-color" placeholder="Colors, comma-separated (required)" required />
              <input type="text" id="${collection}-brand" placeholder="Brand" />
              <input type="number" id="${collection}-timesWorn" placeholder="Times worn" min="0" />
              <input type="text" id="${collection}-notes" placeholder="Notes" class="full" />
              <input type="date" id="${collection}-dateAdded" title="Date acquired" class="full" />
            </div>
            <label class="check-label">
              <input type="checkbox" id="${collection}-nuuly" /> Nuuly (rented)
            </label>
            <div class="form-actions">
              <button class="btn-submit" onclick="addItem('${collection}')">Add</button>
              <button class="btn-cancel" onclick="toggleAddForm('${collection}')">Cancel</button>
            </div>
          </div>
        </div>`
    }

    let allData = { pants: [], shirts: [], pullovers: [], athletic: [], jackets: [] }

    function renderAll(data) {
      document.getElementById('sections').innerHTML =
        COLLECTIONS.map(c => renderSection(c, data[c] || [])).join('')
    }

    function toggleAddForm(collection) {
      document.getElementById(`add-form-${collection}`).classList.toggle('open')
    }

    async function addItem(collection) {
      const nameEl = document.getElementById(`${collection}-name`)
      const colorEl = document.getElementById(`${collection}-color`)
      if (!nameEl.value.trim() || !colorEl.value.trim()) {
        nameEl.style.borderColor = nameEl.value.trim() ? '' : '#e05'
        colorEl.style.borderColor = colorEl.value.trim() ? '' : '#e05'
        return
      }
      const body = {
        name: nameEl.value.trim(),
        color: colorEl.value.split(',').map(c => c.trim()).filter(Boolean),
        brand: document.getElementById(`${collection}-brand`).value.trim() || undefined,
        timesWorn: document.getElementById(`${collection}-timesWorn`).value
          ? parseInt(document.getElementById(`${collection}-timesWorn`).value) : 0,
        notes: document.getElementById(`${collection}-notes`).value.trim() || undefined,
        nuuly: document.getElementById(`${collection}-nuuly`).checked || undefined,
        dateAdded: document.getElementById(`${collection}-dateAdded`).value || undefined,
      }
      await fetch(`/api/${collection}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      })
      await loadAll()
    }

    async function deleteItem(collection, id) {
      await fetch(`/api/${collection}/${id}`, { method: 'DELETE' })
      await loadAll()
    }

    const COLLECTION_COLORS = {
      pants: '#89aed4', shirts: '#d4896a', pullovers: '#d4a8c4', athletic: '#87b07a', jackets: '#aa8ec8'
    }
    let scatterChart = null
    let brandChart = null
    let colorChart = null

    function renderScatterChart() {
      const today = new Date()
      const datasets = COLLECTIONS.map(col => ({
        label: LABELS[col],
        data: (allData[col] || []).filter(i => !i.archived).map(item => {
          const date = item.dateAdded
            ? new Date(item.dateAdded)
            : new Date(parseInt(String(item._id).substring(0, 8), 16) * 1000)
          return {
            x: Math.floor((today - date) / 86400000),
            y: item.timesWorn || 0,
            _name: item.name,
            _brand: item.brand || '',
          }
        }),
        backgroundColor: COLLECTION_COLORS[col],
        pointRadius: 8,
        pointHoverRadius: 12,
      }))
      const ctx = document.getElementById('wardrobe-chart').getContext('2d')
      if (scatterChart) scatterChart.destroy()
      scatterChart = new Chart(ctx, {
        type: 'scatter',
        data: { datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'top', labels: { usePointStyle: true, pointStyle: 'circle', color: '#555', font: { size: 12 } } },
            tooltip: {
              callbacks: {
                label(ctx) {
                  const d = ctx.raw
                  const brand = d._brand ? ` · ${d._brand}` : ''
                  return `${d._name}${brand} — worn ${ctx.parsed.y}x (${ctx.parsed.x} days owned)`
                }
              }
            }
          },
          scales: {
            x: { title: { display: true, text: 'Days owned', color: '#999', font: { size: 11 } }, grid: { color: '#f0e6da' }, ticks: { color: '#c4aa90', precision: 0 }, beginAtZero: true },
            y: { title: { display: true, text: 'Times worn', color: '#999', font: { size: 11 } }, grid: { color: '#f0e6da' }, ticks: { color: '#c4aa90', precision: 0 }, beginAtZero: true, suggestedMax: 5 }
          }
        }
      })
    }

    function renderBrandChart() {
      const brandMap = {}
      COLLECTIONS.forEach(col => {
        (allData[col] || []).filter(i => !i.archived).forEach(item => {
          const b = (item.brand || 'Unknown').trim()
          if (!brandMap[b]) brandMap[b] = { count: 0, worn: 0 }
          brandMap[b].count++
          brandMap[b].worn += item.timesWorn || 0
        })
      })
      const sorted = Object.entries(brandMap).sort((a, b) => b[1].count - a[1].count)
      const labels = sorted.map(([b]) => b)
      const counts = sorted.map(([, v]) => v.count)
      const wornTotals = sorted.map(([, v]) => v.worn)

      const wrap = document.getElementById('brand-chart-wrap')
      wrap.style.height = Math.max(200, sorted.length * 44) + 'px'

      const ctx = document.getElementById('brand-chart').getContext('2d')
      if (brandChart) brandChart.destroy()
      brandChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [
            { label: 'Items', data: counts, backgroundColor: '#8b7bb5', borderRadius: 4, barPercentage: 0.55 },
            { label: 'Times worn', data: wornTotals, backgroundColor: '#e8b98a', borderRadius: 4, barPercentage: 0.55 },
          ]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'top', labels: { usePointStyle: true, pointStyle: 'circle', color: '#555', font: { size: 11 } } },
          },
          scales: {
            x: { beginAtZero: true, grid: { color: '#f0ede8' }, ticks: { color: '#bbb', stepSize: 1 } },
            y: { grid: { display: false }, ticks: { color: '#555', font: { size: 11 } } }
          }
        }
      })
    }

    function renderColorChart() {
      const colorCount = {}
      COLLECTIONS.forEach(col => {
        (allData[col] || []).filter(i => !i.archived).forEach(item => {
          const colors = Array.isArray(item.color) ? item.color : (item.color ? [item.color] : [])
          colors.forEach(c => {
            const key = c.toLowerCase().trim()
            colorCount[key] = (colorCount[key] || 0) + 1
          })
        })
      })
      const sorted = Object.entries(colorCount).sort((a, b) => b[1] - a[1])
      const labels = sorted.map(([c]) => c.charAt(0).toUpperCase() + c.slice(1))
      const data = sorted.map(([, n]) => n)
      const bgColors = sorted.map(([c]) => {
        const css = colorToCss(c)
        return css.startsWith('linear-gradient') ? '#ccc' : css
      })
      const borderColors = sorted.map(([c]) => {
        const css = colorToCss(c)
        if (css.startsWith('linear-gradient')) return '#ccc'
        return css === '#f5f5f0' ? '#e0ddd8' : css
      })

      const ctx = document.getElementById('color-chart').getContext('2d')
      if (colorChart) colorChart.destroy()
      colorChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels,
          datasets: [{
            data,
            backgroundColor: bgColors,
            borderColor: borderColors,
            borderWidth: 2,
            hoverOffset: 8,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'right',
              labels: { usePointStyle: true, pointStyle: 'circle', color: '#555', font: { size: 11 }, padding: 12 }
            },
            tooltip: {
              callbacks: {
                label(ctx) { return ` ${ctx.label}: ${ctx.raw} item${ctx.raw !== 1 ? 's' : ''}` }
              }
            }
          }
        }
      })
    }

    let editTarget = { collection: null, id: null }

    function openEditModal(collection, id) {
      const item = (allData[collection] || []).find(i => String(i._id) === String(id))
      if (!item) return
      editTarget = { collection, id }
      const colors = Array.isArray(item.color) ? item.color : (item.color ? [item.color] : [])
      document.getElementById('edit-name').value = item.name || ''
      document.getElementById('edit-color').value = colors.join(', ')
      document.getElementById('edit-brand').value = item.brand || ''
      document.getElementById('edit-timesWorn').value = item.timesWorn != null ? item.timesWorn : ''
      document.getElementById('edit-notes').value = item.notes || ''
      document.getElementById('edit-nuuly').checked = !!item.nuuly
      document.getElementById('edit-dateAdded').value = item.dateAdded ? item.dateAdded.slice(0, 10) : ''
      document.getElementById('edit-modal').classList.add('open')
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.remove('open')
      editTarget = { collection: null, id: null }
    }

    function handleModalClick(e) {
      if (e.target === document.getElementById('edit-modal')) closeEditModal()
    }

    async function addWear(collection, id) {
      await fetch(`/api/${collection}/${id}/wear`, { method: 'PATCH' })
      await loadAll()
    }

    async function archiveItem() {
      const { collection, id } = editTarget
      if (!collection || !id) return
      await fetch(`/api/${collection}/${id}/archive`, { method: 'PATCH' })
      closeEditModal()
      await loadAll()
    }

    async function saveEdit() {
      const { collection, id } = editTarget
      if (!collection || !id) return
      const nameEl = document.getElementById('edit-name')
      const colorEl = document.getElementById('edit-color')
      if (!nameEl.value.trim() || !colorEl.value.trim()) {
        nameEl.style.borderColor = nameEl.value.trim() ? '' : '#e05'
        colorEl.style.borderColor = colorEl.value.trim() ? '' : '#e05'
        return
      }
      const body = {
        name: nameEl.value.trim(),
        color: colorEl.value.split(',').map(c => c.trim()).filter(Boolean),
        brand: document.getElementById('edit-brand').value.trim() || undefined,
        timesWorn: document.getElementById('edit-timesWorn').value
          ? parseInt(document.getElementById('edit-timesWorn').value) : 0,
        notes: document.getElementById('edit-notes').value.trim() || undefined,
        nuuly: document.getElementById('edit-nuuly').checked || undefined,
        dateAdded: document.getElementById('edit-dateAdded').value || undefined,
      }
      await fetch(`/api/${collection}/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      })
      closeEditModal()
      await loadAll()
    }

    async function loadAll() {
      const results = await Promise.all(
        COLLECTIONS.map(c => fetch(`/api/${c}`).then(r => r.json()))
      )
      COLLECTIONS.forEach((c, i) => { allData[c] = results[i] })
      renderAll(allData)
      renderScatterChart()
      renderBrandChart()
      renderColorChart()
    }

    loadAll()
  </script>
</body>
</html>
